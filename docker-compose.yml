services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres@sha256:d0f363f8366fbc3f52d172c6e76bc27151c3d7b082ebb8d2d7ef5d5db22e84f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinsync
      POSTGRES_PASSWORD: kinsync
      POSTGRES_DB: kinsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MailHog (local SMTP / email preview) ─────────────────────────────────
  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data: