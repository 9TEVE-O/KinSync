name: "Dependency Review"

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes for vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce packages with high or critical CVEs
          fail-on-severity: high
          # Also block packages with known license violations
          deny-licenses: GPL-2.0, AGPL-3.0
          # Post a summary comment on the PR
          comment-summary-in-pr: always
