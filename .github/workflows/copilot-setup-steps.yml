name: "Copilot Setup Steps"

on:
    workflow_dispatch:
    push:
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
    workflow_dispatch:
    push:
        paths:
            - '.github/workflows/copilot-setup-steps.yml'
    pull_request:
        paths:
            - '.github/workflows/copilot-setup-steps.yml'
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Install Hermes Agent
- run: curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --skip-setup
+ run: |
  curl -fsSL --fail --retry 3 --retry-delay 5 -o /tmp/install.sh https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
+   echo "Expected checksum here" | sha256sum -c -
+   bash /tmp/install.sh --skip-setup

            - name: Verify Hermes Agent installation
              run: test -d "$HOME/.hermes/hermes-agent"
