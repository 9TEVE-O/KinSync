name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install Hermes Agent
        run: |
          curl -fsSL --fail --retry 3 --retry-delay 5 \
            -o /tmp/install.sh \
            https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
          bash /tmp/install.sh --skip-setup
          INSTALL_EXIT_CODE=$?
          if [ $INSTALL_EXIT_CODE -ne 0 ]; then
            echo "Hermes Agent installation failed with exit code $INSTALL_EXIT_CODE"
            exit $INSTALL_EXIT_CODE
          fi

      - name: Verify Hermes Agent installation
        run: test -d "$HOME/.hermes/hermes-agent"
