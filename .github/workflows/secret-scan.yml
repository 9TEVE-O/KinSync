name: "Secret & Credential Scanning"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  # Needed to post scan results to the Security tab
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks – detect leaked secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can inspect every commit in a push
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Treat findings as a hard failure (exit 1) to block the build
          GITLEAKS_EXIT_CODE: "1"

  custom-pattern-check:
    name: Block hardcoded API keys & env credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for forbidden patterns
        # Detects:
        #  - Google / Gemini API keys  (AIza…)
        #  - Generic "API_KEY = " / "API_SECRET = " assignments
        #  - SALT / PEPPER values assigned inline
        #  - Private key PEM headers
        #  - Connection strings containing a password component
        run: |
          set +e   # collect all findings before exiting

          FAIL=0

          echo "::group::Scanning for forbidden credential patterns"

          # Google / Gemini API keys
          if git --no-pager grep -rn --extended-regexp \
               'AIza[0-9A-Za-z_\-]{35}' -- ':!*.yml' ':!*.yaml' ':!*.md'; then
            echo "::error::Hardcoded Google/Gemini API key detected."
            FAIL=1
          fi

          # Generic API key / secret assignments – quoted, unquoted, and backtick forms
          if git --no-pager grep -rn --extended-regexp \
               '(API_KEY|API_SECRET|SECRET_KEY|APP_SECRET)\s*=\s*(`[^`]{8,}`|["\047][^"\047]{8,}["\047]|[^"\047`\s\$\{][^\s,;]{7,})' \
               -- ':!*.example' ':!*.md' ':!*.txt'; then
            echo "::error::Hardcoded API key or secret value detected."
            FAIL=1
          fi

          # SALT / PEPPER values (minimum 8 chars to avoid test/doc false positives)
          if git --no-pager grep -rn --extended-regexp \
               '(SALT|PEPPER|HASH_SALT)\s*=\s*["\047][^"\047]{8,}["\047]' \
               -- ':!*.example' ':!*.md' ':!*.txt'; then
            echo "::error::Hardcoded SALT or PEPPER value detected."
            FAIL=1
          fi

          # Private key PEM blocks
          if git --no-pager grep -rn \
               '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'; then
            echo "::error::Private key material detected."
            FAIL=1
          fi

          # Passwords embedded in connection strings (require protocol prefix for context)
          if git --no-pager grep -rn --extended-regexp \
               '(postgres(ql)?|mysql|mongodb|redis|amqp|smtp):\/\/[^:]+:[^@\s\$\{]{5,}@' \
               -- ':!*.example' ':!*.md' ':!*.txt'; then
            echo "::error::Hardcoded password in connection string detected."
            FAIL=1
          fi

          echo "::endgroup::"

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "One or more hardcoded secrets were found."
            echo "Remove them, rotate the affected credentials, and use environment"
            echo "variables or a secrets manager (e.g., GitHub Secrets) instead."
            exit 1
          fi

          echo "No forbidden credential patterns found."
